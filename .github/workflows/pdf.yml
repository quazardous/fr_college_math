# =====================================================================
#  Produit les PDF et les attache à la release.
#
#  Les PDF ne sont plus versionnés : ils sont engendrés depuis les
#  sources Markdown à chaque tag, et publiés comme actifs de release.
#
#    git tag v1.1 && git push origin v1.1   -> release v1.1 + PDF
#    déclenchement manuel                   -> PDF en artefact du run
# =====================================================================
name: PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Un seul déploiement à la fois, et on laisse finir celui qui est en cours
# plutôt que de le couper au milieu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dépendances Node
        run: npm ci --no-audit --no-fund

      # pdfinfo sert au compte de pages affiché par build.sh ; sans lui la
      # compilation marche quand même, mais le journal devient muet.
      - name: poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Binaire unique : Tectonic télécharge à la demande les seuls paquets
      # TeX utilisés. Pas de TeX Live à installer.
      - name: Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Construire
        run: ./build.sh

      # Une compilation verte peut laisser passer un renvoi non résolu, une
      # police non embarquée ou des commandes LaTeX dans les signets.
      - name: Vérifier les PDF
        run: npm run check

      - name: Artefact du run
        uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: pdf/*.pdf
          if-no-files-found: error

      # Le site : mêmes sources, troisième sortie.
      - name: Construire le site
        run: node tools/site.mjs

      - name: Artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publier sur la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" pdf/*.pdf --clobber
          else
            gh release create "$tag" pdf/*.pdf --title "$tag" --generate-notes
          fi

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5
